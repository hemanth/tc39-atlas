name: Monthly TC39 Dataset Sync

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      force_reclassify:
        description: 'Force re-classify all proposals from scratch'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-dataset:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch latest proposals & enrich with TypeSafe AI
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_reclassify }}" = "true" ]; then
            npm run fetch:proposals
            npm run enrich:api -- --force
          else
            npm run sync
          fi

      - name: Verify build integrity
        run: npm run build

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add proposals.json src/data/enrichedProposals.json

          if git diff --staged --quiet; then
            echo "No changes detected in TC39 proposals or enrichments."
          else
            git commit -m "chore(data): monthly sync TC39 proposals and TypeSafe AI enrichments [skip ci]"
            git push
          fi
